; General panel and display defaults
[general]
; 1 = existing FTD/ITD, 2 = real/theoretical distance-based symbols
mode = 1
minimumAltitude = 1000
maxDistance = 0
defaultRows = 999
; Startup PROP ON/OFF state; the UI can toggle it during the session
proposalsEnabled = true
ftdMarkerSize = 20
itdMarkerSize = 18
proposalTagText = P

; Mode 2 display settings (NM, except heading tolerance in degrees)
[mode2]
; Sequence-warning display only; does not limit FTD or turn calculations
calculationAreaNm = 40
localizerToleranceNm = 0.5
headingToleranceDegrees = 30
predictionMarginNm = 0.5

; Airports used for weather lookup
[airports]
codes = EDDF

; Distances are nautical miles; courses are degrees
[runways.EDDF.07L]
localizerPointNm = 18
localizerCourseDegrees = 69

[runways.EDDF.07C]
localizerPointNm = 14
localizerCourseDegrees = 69

[runways.EDDF.07R]
localizerPointNm = 14
localizerCourseDegrees = 69

[runways.EDDF.25L]
localizerPointNm = 12
localizerCourseDegrees = 249

[runways.EDDF.25C]
localizerPointNm = 12
localizerCourseDegrees = 249

[runways.EDDF.25R]
localizerPointNm = 14
localizerCourseDegrees = 249

[runways.LEPA.24L]
localizerPointNm = 10
localizerCourseDegrees = 243

; Distances are nautical miles
[separation]
; Select WTC (default) or RECAT-EU
scheme = WTC
minimumDistanceNm = 3.5
minimumParallelDependentDistanceNm = 1.5
finalBufferNm = 0.5

; Wake-category separation distances in nautical miles
[wake]
H_H = 4
H_L = 6
H_M = 5
J_H = 6
J_L = 8
J_M = 7
M_L = 5

; RECAT-EU category = comma-separated aircraft type designators
; Starter assignments from the RECAT-EU example list; verify/update against the current Appendix F.
[recat]
A = A388,A124
B = A332,A333,A343,A345,A346,A359,B744,B748,B772,B773,B77L,B77W,B788,B789,IL96
C = A306,A30B,A310,B703,B752,B753,B762,B763,B764,B783,C135,DC10,DC85,IL76,MD11,TU22,TU95
D = A318,A319,A320,A321,AN12,B736,B737,B738,B739,C130,IL18,MD81,MD82,MD83,MD87,MD88,MD90,T204,TU16
E = AT43,AT45,AT72,B712,B732,B733,B734,B735,CL60,CRJ1,CRJ2,CRJ7,CRJ9,DH8D,E135,E145,E170,E175,E190,E195,F70,F100,GLF4,RJ85,RJ1H
F = FA10,FA20,D328,E120,BE40,BE45,H25B,JS32,JS41,LJ35,LJ60,SF34,P180,C650,C525,C180,C152

; Distance-based RECAT-EU separation minima in nautical miles (leader_follower)
[recat.separation]
A_A = 3
A_B = 4
A_C = 5
A_D = 5
A_E = 6
A_F = 8
B_B = 3
B_C = 4
B_D = 4
B_E = 5
B_F = 7
C_B = 2.5
C_C = 3
C_D = 3
C_E = 4
C_F = 6
D_F = 5
E_F = 4
F_F = 3

; Profile names are one to three letters or digits
[profiles]
default = DEP

[profile.ALT]
EDDF.25L.25C = ALTERNATING
EDDF.25L.25R = ALTERNATING
EDDF.25C.25R = ALTERNATING
EDDF.07R.07C = ALTERNATING
EDDF.07L.07R = ALTERNATING
EDDF.07C.07L = ALTERNATING

[profile.DEP]
EDDF.25L.25C = ALTERNATING
EDDF.25L.25R = DEPENDANT
EDDF.25C.25R = DEPENDANT
EDDF.07R.07C = ALTERNATING
EDDF.07R.07L = DEPENDANT
EDDF.07C.07L = DEPENDANT

[profile.IND]
EDDF.25L.25C = ALTERNATING
EDDF.25L.25R = INDEPENDENT
EDDF.25C.25R = INDEPENDENT
EDDF.07R.07C = ALTERNATING
EDDF.07R.07L = INDEPENDENT
EDDF.07C.07L = INDEPENDENT

; Speed model in knots and nautical miles
[speed]
longApproachNm = 999
longApproachSpeedKts = 220
speedUntilReductionKts = 170
reduceSpeedOnClearance = false
speedReductionNm = 5
finalApproachSpeed_H = 152
finalApproachSpeed_L = 105
finalApproachSpeed_M = 130
finalApproachSpeed_S = 145

